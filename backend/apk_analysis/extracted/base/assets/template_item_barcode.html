<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1.5">
    <script src='template_item_barcode.js' type='text/javascript'></script>
    <style>
        @page {
            size: A4;
            margin: 2mm;
        }

        body {
            margin: 0;
            padding: 0;
            font-size: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            page-break-inside: avoid;
            height: 92px;
        }

        td {
            width: 25%;
            text-align: center;
            padding: 5px;
            vertical-align: middle;
            line-height: 1;
        }

        td img {
            width: 100%;
            max-width: 100%;
            height: auto;
            max-height: 62px;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>
    <div id="barcode-container"></div>
</body>

</html>
