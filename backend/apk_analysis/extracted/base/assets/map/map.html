<!DOCTYPE html>
<html>

    <link href="maplibre-gl.css" rel="stylesheet" />
    <script src="maplibre-gl.js"></script>
    <style>
        html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
        /* The design's `elevated` token: drop-shadow follows the teardrop, box-shadow would not. */
        .pin { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2)); }
        .live-dot {
            width: 18px; height: 18px; border-radius: 50%;
            background: #0C8CE9; border: 3px solid #FFFFFF;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
        }
        .maplibregl-popup-content { padding: 4px 10px; font: 600 13px 'Source Sans Pro', Arial, sans-serif; }
    </style>

    // The pin's white circle, in the SVG's 28x36 user space.

    // Glyph width as a fraction of that circle's diameter, measured off the design.
    var GLYPH_RATIO = 0.712;
    var markers = [];
    var markersById = {};

    // Builds a teardrop pin element with a per-type coloured body + coloured glyph on white.
    function makePinElement(type) {
        var color = TYPE_COLORS[type] || TYPE_COLORS.note;
        var glyph = GLYPHS[type] || GLYPHS.note;
        // Fit the glyph's viewport into a square centred on the circle: the icons are authored
        // at different viewports (20 for check-in/out, 24 for note), so scale per glyph.
        var box = PIN_CIRCLE.r * 2 * GLYPH_RATIO;
        var scale = box / glyph.size;
        var offset = box / 2;
        var paths = glyph.paths.map(function (d) { return '<path d="' + d + '"/>'; }).join('');
        var el = document.createElement('div');
        el.className = 'pin';
        el.innerHTML =
            '<svg width="34" height="44" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">' +
              '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '"/>' +
              '<circle cx="' + PIN_CIRCLE.cx + '" cy="' + PIN_CIRCLE.cy + '" r="' + PIN_CIRCLE.r + '" fill="#FFFFFF"/>' +
              '<g transform="translate(' + (PIN_CIRCLE.cx - offset) + ',' + (PIN_CIRCLE.cy - offset) + ') scale(' + scale + ')" fill="' + color + '">' + paths + '</g>' +
            '</svg>';
        return el;
    }

    var map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [77.3261, 28.5710],
        zoom: 15,
        attributionControl: false
    });

    // Keep the centred point in the upper half so the bottom sheet doesn't hide it.
    function cameraPadding() {
        return { top: 0, right: 0, bottom: Math.round(map.getContainer().clientHeight * 0.5), left: 0 };
    }

    function clearMarkers() {
        markers.forEach(function (m) { m.remove(); });
        markers = [];
        markersById = {};
    }

    // Called from native with { live: {lat,lng}, activities: [{id,type,title,lat,lng}] }.
    function setData(data) {
        clearMarkers();
        if (data.live && data.live.lat != null && data.live.lng != null) {
            var el = document.createElement('div');
            el.className = 'live-dot';
            markers.push(new maplibregl.Marker({ element: el }).setLngLat([data.live.lng, data.live.lat]).addTo(map));
            map.jumpTo({ center: [data.live.lng, data.live.lat], zoom: 15, padding: cameraPadding() });
        }
        (data.activities || []).forEach(function (a) {
            var el = makePinElement(a.type);
            el.style.cursor = 'pointer';
            /* Tapping a pin toggles its title popup — handled by MapLibre, no native bridge needed. */
            var popup = new maplibregl.Popup({ offset: 44, anchor: 'bottom', closeButton: false }).setText(a.title || '');
            var marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                .setLngLat([a.lng, a.lat])
                .setPopup(popup)
                .addTo(map);
            markers.push(marker);
            markersById[a.id] = marker;
        });
    }

    // Fly to the staff's current location (no popup) — used by the current-location control.
    function flyTo(lng, lat) {
        map.flyTo({ center: [lng, lat], zoom: 16, padding: cameraPadding(), essential: true });
    }

    // Fly to a specific activity marker and show its title popup — used by activity-row taps.
    function flyToActivity(id) {
        var marker = markersById[id];
        if (!marker) return;
        var ll = marker.getLngLat();
        map.flyTo({ center: [ll.lng, ll.lat], zoom: 16, padding: cameraPadding(), essential: true });
        if (!marker.getPopup().isOpen()) marker.togglePopup();
    }

    map.on('load', function () {
        if (window.AndroidMap && AndroidMap.onReady) AndroidMap.onReady();
    });
